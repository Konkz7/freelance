<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #0a0a0b;
        color: #f4f3f0;
        font-family: 'Instrument Sans', system-ui, sans-serif;
        position: relative;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(244,243,240,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(244,243,240,0.05) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(80% 70% at 50% 0%, black, transparent);
      }
      .glow {
        position: absolute; top: -340px; left: 50%;
        width: 1100px; height: 700px; transform: translateX(-50%);
        border-radius: 9999px;
        background: radial-gradient(closest-side, rgba(237,180,88,0.14), transparent);
      }
      .inner { position: relative; padding: 72px 76px; height: 100%; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .mark {
        width: 40px; height: 40px; border-radius: 10px;
        border: 1px solid #2d2d34; background: #121214;
        display: grid; place-items: center;
      }
      .diamond { width: 13px; height: 13px; border-radius: 2px; background: #edb458; transform: rotate(45deg); }
      .name { font-size: 25px; font-weight: 500; letter-spacing: -0.02em; }
      h1 {
        margin-top: auto;
        font-size: 82px; line-height: 1.02; font-weight: 500;
        letter-spacing: -0.035em; max-width: 960px;
      }
      .italic { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #edb458; letter-spacing: -0.015em; }
      p.lead { margin-top: 30px; font-size: 27px; line-height: 1.45; color: #9d9da5; max-width: 880px; }
      .foot {
        margin-top: auto; padding-top: 34px; border-top: 1px solid #202024;
        display: flex; align-items: center; justify-content: space-between;
      }
      .caps { display: flex; gap: 26px; font-size: 16px; color: #7d7d87; }
      .status { display: flex; align-items: center; gap: 11px; font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #edb458; }
      .dot { width: 9px; height: 9px; border-radius: 9999px; background: #edb458; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="inner">
      <div class="brand">
        <span class="mark"><span class="diamond"></span></span>
        <span class="name">Amara Okonkwo</span>
      </div>

      <h1>Software built around <span class="italic">your idea</span>.</h1>
      <p class="lead">
        Android apps, web applications, Unity experiences and the backend
        services behind them.
      </p>

      <div class="foot">
        <div class="caps">
          <span>Android</span><span>Web apps</span><span>Unity</span>
          <span>APIs &amp; microservices</span><span>Code audits</span>
        </div>
        <div class="status"><span class="dot"></span>London, UK</div>
      </div>
    </div>
  </body>
</html>
