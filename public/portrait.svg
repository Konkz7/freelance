<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img">
  <defs>
    <pattern id="pg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="warm" cx="50%" cy="38%">
      <stop offset="0%" stop-color="rgba(237,180,88,0.16)"/>
      <stop offset="100%" stop-color="rgba(237,180,88,0)"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2b33"/>
      <stop offset="100%" stop-color="#1b1b21"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#141417"/>
  <rect width="800" height="1000" fill="url(#pg)"/>
  <ellipse cx="400" cy="380" rx="340" ry="320" fill="url(#warm)"/>

  <!-- Abstract head and shoulders -->
  <path d="M110 1000 C 110 780, 250 690, 400 690 C 550 690, 690 780, 690 1000 Z" fill="url(#fig)"/>
  <circle cx="400" cy="480" r="150" fill="url(#fig)"/>
  <circle cx="400" cy="480" r="150" fill="none" stroke="rgba(237,180,88,0.22)" stroke-width="2"/>
  <path d="M110 1000 C 110 780, 250 690, 400 690 C 550 690, 690 780, 690 1000"
        fill="none" stroke="rgba(237,180,88,0.18)" stroke-width="2"/>

  <text x="400" y="928" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="20" letter-spacing="3" fill="#7d7d87">PORTRAIT PLACEHOLDER</text>
  <text x="400" y="962" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="16" letter-spacing="1" fill="#55555f">save yours as public/portrait.jpg</text>
</svg>
